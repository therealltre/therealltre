name: GitHub Contribution Snake

on:
  schedule:
    - cron: '0 0 * * *'  # runs daily
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Generate Snake SVG
        uses: platane/snk@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_user_name: therealltre
