name: GitHub Contribution Snake

on:
  schedule:
    - cron: '0 0 * * *'  # runs daily
  workflow_dispatch:

jobs:
  generate-snake:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Generate snake SVG
        id: generate
        uses: platane/snk@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_user_name: therealltre

      - name: Save snake SVG to file
        run: |
          echo "${{ steps.generate.outputs.snake-svg }}" > github-contribution-grid-snake.svg

      - name: Commit & push SVG
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-contribution-grid-snake.svg
          git commit -m "Update GitHub contribution snake" || echo "No changes to commit"
          git push origin main
